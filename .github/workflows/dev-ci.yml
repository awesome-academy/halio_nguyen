name: Dev CI - Automated Quality Gate

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Backend CI (Golang Echo)
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend Tests & Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go 1.25+
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests with Race Detection
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Verify Binary Compilation
        run: go build -v ./cmd/server

  # ----------------------------------------------------------------------------
  # 2. Frontend CI (Next.js App Router)
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Lint & Build Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check ESLint
        run: pnpm run lint

      - name: Check TypeScript & Production Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
